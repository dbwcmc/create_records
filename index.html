<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Enrollment Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: lightgrey;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            max-width: 700px;
            width: 100%;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section-title {
            color: #B31B1B;
            font-size: 20px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #B31B1B;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .required {
            color: #e74c3c;
            margin-left: 3px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #B31B1B;
            box-shadow: 0 0 0 3px rgba(179, 27, 27, 0.1);
        }

        input:invalid:not(:placeholder-shown) {
            border-color: #e74c3c;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-option input[type="radio"] {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        .radio-option label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .submit-btn {
            background: #B31B1B;;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(179, 27, 27, 0.4);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .status-processing {
            background-color: #fff3cd;
            color: #856404;
            border: 2px solid #ffeaa7;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(133, 100, 4, 0.3);
            border-radius: 50%;
            border-top-color: #856404;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-box {
            background: #fff5f5;
            border-left: 4px solid #B31B1B;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 5px;
            font-size: 14px;
            color: #555;
        }

        .link-display {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px solid #B31B1B;
        }

        .link-display h3 {
            color: #B31B1B;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .progress {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
            display: none;
        }

        .progress-step {
            padding: 8px 0;
            color: #856404;
        }

        .progress-step.complete {
            color: #155724;
        }

        .progress-step.complete:before {
            content: "✓ ";
            font-weight: bold;
        }

        .progress-step.current {
            font-weight: bold;
            color: #004085;
        }

        .progress-step.current:before {
            content: "→ ";
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Family Enrollment Form</h1>
        <p class="subtitle">New Patient Enrollment</p>

        <div class="info-box">
            <strong>📝 Instructions:</strong> This form is used to enroll new patients into the study. All patients will be enrolled in the baseline arm.
        </div>

        <form id="enrollmentForm">
            <!-- API Token -->
            <div class="section-title">🔑 API Configuration</div>
            
            <div class="form-group">
                <label for="apiToken">REDCap API Token <span class="required">*</span></label>
                <input type="password" id="apiToken" name="apiToken" required placeholder="Enter your REDCap API token">
            </div>

            <!-- Participant Information -->
            <div class="section-title">👤 Participant Information</div>

            <div class="form-group">
                <label for="ptFirstName">First Name <span class="required">*</span></label>
                <input type="text" id="ptFirstName" name="ptFirstName" required>
            </div>

            <div class="form-group">
                <label for="ptLastName">Last Name <span class="required">*</span></label>
                <input type="text" id="ptLastName" name="ptLastName" required>
            </div>

            <div class="form-group">
                <label for="ptDob">Date of Birth <span class="required">*</span></label>
                <input type="date" id="ptDob" name="ptDob" required>
            </div>

            <div class="form-group" id="ageDisplay" style="display: none;">
                <label>Calculated Age:</label>
                <div style="padding: 12px 15px; background: #f8f9fa; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; font-weight: bold; color: #333;">
                    <span id="calculatedAge">--</span> years old
                </div>
            </div>

            <div class="form-group">
                <label for="ptEmail">Email</label>
                <input type="email" id="ptEmail" name="ptEmail" placeholder="participant@example.com">
            </div>

            <div class="form-group">
                <label for="ptPhone">Phone Number</label>
                <input type="tel" id="ptPhone" name="ptPhone" placeholder="(555) 555-5555">
            </div>

            <!-- Notification Preference -->
            <div class="form-group">
                <label>How would they like to receive notifications? <span class="required">*</span></label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="notifMyCap" name="notificationPreference" value="1" required>
                        <label for="notifMyCap">MyCap</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="notifEmail" name="notificationPreference" value="2">
                        <label for="notifEmail">Email</label>
                    </div>
                </div>
            </div>

            <!-- Caregiver Consent (shown for minors) -->
            <div id="caregiverConsentSection" class="hidden">
                <div class="section-title">👨‍👩‍👧 Caregiver Participation</div>
                
                <div class="form-group">
                    <label>Does the caregiver consent to participate in the study? <span class="required">*</span></label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="cgConsentYes" name="caregiverConsent" value="yes" checked>
                            <label for="cgConsentYes">Yes</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="cgConsentNo" name="caregiverConsent" value="no">
                            <label for="cgConsentNo">No (but enter caregiver info)</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="cgConsentNone" name="caregiverConsent" value="none">
                            <label for="cgConsentNone">No caregiver information</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Caregiver Information -->
            <div id="caregiverInfoSection" class="hidden">
                <div class="section-title">👤 Caregiver Information</div>

                <div class="form-group">
                    <label for="cgFirstName">Caregiver First Name <span class="required">*</span></label>
                    <input type="text" id="cgFirstName" name="cgFirstName">
                </div>

                <div class="form-group">
                    <label for="cgLastName">Caregiver Last Name <span class="required">*</span></label>
                    <input type="text" id="cgLastName" name="cgLastName">
                </div>

                <div class="form-group">
                    <label for="cgEmail">Caregiver Email <span class="required">*</span></label>
                    <input type="email" id="cgEmail" name="cgEmail" placeholder="caregiver@example.com">
                </div>

                <div class="form-group">
                    <label for="cgPhone">Caregiver Phone Number</label>
                    <input type="tel" id="cgPhone" name="cgPhone" placeholder="(555) 555-5555">
                </div>
            </div>

            <button type="submit" class="submit-btn">Create Records</button>
        </form>

        <div class="progress" id="progressBox"></div>
        <div class="status-message" id="statusMessage"></div>
        <div class="link-display" id="linksDisplay" style="display: none;"></div>
    </div>

    <script>
        const REDCAP_CONFIG = {
            apiUrl: 'https://redcap.ctsc.weill.cornell.edu/redcap_protocols/api/',
            apiToken: '{{ YOUR_API_TOKEN_HERE }}', // Replace with your actual API token
            arms: {
                patient: 'baseline_arm_2',
                caregiver: 'baseline_arm_1'
            },
            fields: {
                ptFirstName: 'pt_first_name',
                ptLastName: 'pt_last_name',
                ptDob: 'pt_dob',
                ptAge: 'pt_age',
                ptEmail: 'pt_email',
                ptPhone: 'pt_phone',
                cgFirstName: 'cg_first_name',
                cgLastName: 'cg_last_name',
                cgEmail: 'cg_email',
                cgPhone: 'cg_phone',
                recordType: 'record_type',
                notificationPreference: 'notification_preference',
                recordStatus: 'record_status'
            }
        };

        // Progress tracking
        let currentStep = 0;
        const stepsAdult = [
            '1. Creating participant record...',
            '2. Complete!'
        ];
        const stepsMinorWithCG = [
            '1. Creating participant record...',
            '2. Creating caregiver record...',
            '3. Complete!'
        ];
        const stepsMinorNoCG = [
            '1. Creating participant record...',
            '2. Complete!'
        ];

        const form = document.getElementById('enrollmentForm');
        const statusMessage = document.getElementById('statusMessage');
        const linksDisplay = document.getElementById('linksDisplay');
        const progressBox = document.getElementById('progressBox');

        // Form elements
        const ptDobInput = document.getElementById('ptDob');
        const caregiverConsentSection = document.getElementById('caregiverConsentSection');
        const caregiverInfoSection = document.getElementById('caregiverInfoSection');
        const cgConsentRadios = document.querySelectorAll('input[name="caregiverConsent"]');

        // Dynamic form visibility based on age
        ptDobInput.addEventListener('change', function() {
            const dob = this.value;
            if (!dob) {
                document.getElementById('ageDisplay').style.display = 'none';
                return;
            }

            const age = calculateAge(dob);
            
            // Display the calculated age
            document.getElementById('calculatedAge').textContent = age;
            document.getElementById('ageDisplay').style.display = 'block';
            
            const isMinor = age < 18;

            if (isMinor) {
                caregiverConsentSection.classList.remove('hidden');
                // Make caregiver consent required for minors
                cgConsentRadios.forEach(radio => {
                    radio.required = true;
                });
                // Set default to "yes" and show caregiver info section
                document.getElementById('cgConsentYes').checked = true;
                caregiverInfoSection.classList.remove('hidden');
                // Make caregiver fields required since default is "yes"
                document.getElementById('cgFirstName').required = true;
                document.getElementById('cgLastName').required = true;
                document.getElementById('cgEmail').required = true;
            } else {
                caregiverConsentSection.classList.add('hidden');
                caregiverInfoSection.classList.add('hidden');
                cgConsentRadios.forEach(radio => {
                    radio.required = false;
                    radio.checked = false;
                });
                // Clear and unrequire caregiver fields
                clearCaregiverFields();
            }
        });

        // Show/hide caregiver info based on consent
        cgConsentRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                const showCgInfo = this.value === 'yes' || this.value === 'no';
                
                if (showCgInfo) {
                    caregiverInfoSection.classList.remove('hidden');
                    // Make caregiver fields required
                    document.getElementById('cgFirstName').required = true;
                    document.getElementById('cgLastName').required = true;
                    document.getElementById('cgEmail').required = true;
                } else {
                    // "none" option - hide caregiver info
                    caregiverInfoSection.classList.add('hidden');
                    clearCaregiverFields();
                }
            });
        });

        function clearCaregiverFields() {
            const cgFields = ['cgFirstName', 'cgLastName', 'cgEmail', 'cgPhone'];
            cgFields.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                field.value = '';
                field.required = false;
            });
        }

        function calculateAge(dob) {
            if (!dob) return 0;
            
            // Parse the date string as local date (not UTC)
            // The date input gives us YYYY-MM-DD in local timezone
            const [year, month, day] = dob.split('-').map(num => parseInt(num, 10));
            const birthDate = new Date(year, month - 1, day); // month is 0-indexed
            
            // Get today's date in local timezone
            const today = new Date();
            
            // Calculate age
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            
            // Adjust if birthday hasn't occurred yet this year
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            
            return age;
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitButton = form.querySelector('.submit-btn');
            submitButton.disabled = true;
            
            statusMessage.style.display = 'none';
            linksDisplay.style.display = 'none';
            
            // Get API token from form
            const apiToken = document.getElementById('apiToken').value.trim();
            
            const formData = {
                ptFirstName: document.getElementById('ptFirstName').value.trim(),
                ptLastName: document.getElementById('ptLastName').value.trim(),
                dob: document.getElementById('ptDob').value,
                age: calculateAge(document.getElementById('ptDob').value),
                ptEmail: document.getElementById('ptEmail').value.trim(),
                ptPhone: document.getElementById('ptPhone').value.trim(),
                notificationPreference: document.querySelector('input[name="notificationPreference"]:checked').value,
                isAdult: calculateAge(document.getElementById('ptDob').value) >= 18,
                caregiverConsent: null,
                collectCgInfo: false,
                cgFirstName: '',
                cgLastName: '',
                cgEmail: '',
                cgPhone: ''
            };

            // Handle caregiver info for minors
            if (!formData.isAdult) {
                formData.caregiverConsent = document.querySelector('input[name="caregiverConsent"]:checked')?.value;
                formData.collectCgInfo = formData.caregiverConsent === 'yes' || formData.caregiverConsent === 'no';
                
                if (formData.collectCgInfo) {
                    formData.cgFirstName = document.getElementById('cgFirstName').value.trim();
                    formData.cgLastName = document.getElementById('cgLastName').value.trim();
                    formData.cgEmail = document.getElementById('cgEmail').value.trim();
                    formData.cgPhone = document.getElementById('cgPhone').value.trim();
                }
                // If caregiverConsent is "none", collectCgInfo stays false and no caregiver info is collected
            }

            try {
                showProgress();
                showStatus('processing', 'Creating records...');
                
                const result = await createRecords(apiToken, formData);
                
                hideProgress();
                showStatus('success', '✓ Records created successfully!');
                displayLinks(result);
                form.reset();
                caregiverConsentSection.classList.add('hidden');
                caregiverInfoSection.classList.add('hidden');
                
            } catch (error) {
                console.error('Error:', error);
                hideProgress();
                showStatus('error', `✗ Error: ${error.message}`);
            } finally {
                submitButton.disabled = false;
            }
        });

        async function createRecords(apiToken, formData) {
            // Always create new records for new patients
            updateProgress(0);
            const recordNumber = await getNextRecordNumber(apiToken);
            // Format record number with zero-padding (e.g., 0001)
            const paddedRecordNumber = String(recordNumber).padStart(4, '0');
            const ptId = `${paddedRecordNumber}-PT`;
            const cgId = `${paddedRecordNumber}-CG`;

            if (formData.isAdult) {
                // Adult patient - create PT record in baseline_arm_2
                const ptRecordType = 2; // Adult
                await createPtRecord(apiToken, ptId, formData, ptRecordType, REDCAP_CONFIG.arms.patient);
                updateProgress(1);

                return {
                    recordNumber,
                    ptId,
                    isAdult: true,
                    cgCreated: false
                };
            } else {
                // Minor patient - create PT record in baseline_arm_2
                const ptRecordType = 3; // Child 12-17
                const createCGRecord = formData.caregiverConsent === 'yes';
                
                // Always include caregiver info in PT record if collected
                await createPtRecord(apiToken, ptId, formData, ptRecordType, REDCAP_CONFIG.arms.patient, formData.collectCgInfo);
                updateProgress(1);

                if (createCGRecord) {
                    // Create separate CG record in baseline_arm_1
                    await createCgRecord(apiToken, cgId, formData, REDCAP_CONFIG.arms.caregiver);
                    updateProgress(2);

                    return {
                        recordNumber,
                        ptId,
                        cgId,
                        isAdult: false,
                        cgCreated: true
                    };
                } else {
                    // No separate CG record, but caregiver info is in PT record
                    updateProgress(2);

                    return {
                        recordNumber,
                        ptId,
                        isAdult: false,
                        cgCreated: false,
                        caregiverInfoProvided: formData.collectCgInfo
                    };
                }
            }
        }

        async function getNextRecordNumber(apiToken) {
            const body = new URLSearchParams({
                token: apiToken,
                content: 'record',
                format: 'json',
                type: 'flat',
                fields: 'record_id'
            });

            const response = await fetch(REDCAP_CONFIG.apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body.toString()
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Failed to fetch existing records: ${errorText}`);
            }

            const responseText = await response.text();
            
            // Handle empty response (no records in project)
            if (!responseText || responseText.trim() === '' || responseText.trim() === '[]') {
                return 1; // Start with record number 1 if project is empty
            }
            
            let records;
            try {
                records = JSON.parse(responseText);
            } catch (e) {
                throw new Error('Failed to parse records response from REDCap');
            }
            
            // Handle empty array
            if (!Array.isArray(records) || records.length === 0) {
                return 1;
            }
            
            // Extract numeric parts from record IDs (format: NUMBER-PT or NUMBER-CG)
            const recordNumbers = records
                .map(r => {
                    // Remove the suffix (-PT or -CG) and parse the number
                    const match = r.record_id.match(/^(\d+)-(PT|CG)$/);
                    return match ? parseInt(match[1], 10) : NaN;
                })
                .filter(n => !isNaN(n));

            if (recordNumbers.length === 0) {
                return 1;
            }

            const maxRecordNumber = Math.max(...recordNumbers);
            const nextRecordNumber = maxRecordNumber + 1;
            
            return nextRecordNumber;
        }

        async function createPtRecord(apiToken, ptId, formData, recordType, arm, includeCgInfo = true) {
            const record = [{
                record_id: ptId,
                redcap_event_name: arm,
                [REDCAP_CONFIG.fields.ptFirstName]: formData.ptFirstName,
                [REDCAP_CONFIG.fields.ptLastName]: formData.ptLastName,
                [REDCAP_CONFIG.fields.ptDob]: formData.dob,
                [REDCAP_CONFIG.fields.ptAge]: formData.age,
                [REDCAP_CONFIG.fields.recordType]: recordType,
                [REDCAP_CONFIG.fields.notificationPreference]: formData.notificationPreference,
                [REDCAP_CONFIG.fields.recordStatus]: 1  // 1 = New patient
            }];
            
            // Only include email/phone if they have values
            if (formData.ptEmail) {
                record[0][REDCAP_CONFIG.fields.ptEmail] = formData.ptEmail;
            }
            if (formData.ptPhone) {
                record[0][REDCAP_CONFIG.fields.ptPhone] = formData.ptPhone;
            }
            
            // If minor and caregiver info should be included
            if (!formData.isAdult && includeCgInfo && formData.collectCgInfo) {
                record[0][REDCAP_CONFIG.fields.cgFirstName] = formData.cgFirstName;
                record[0][REDCAP_CONFIG.fields.cgLastName] = formData.cgLastName;
                record[0][REDCAP_CONFIG.fields.cgEmail] = formData.cgEmail;
                if (formData.cgPhone) {
                    record[0][REDCAP_CONFIG.fields.cgPhone] = formData.cgPhone;
                }
            }

            const body = new URLSearchParams({
                token: apiToken,
                content: 'record',
                format: 'json',
                type: 'flat',
                overwriteBehavior: 'normal',
                data: JSON.stringify(record),
                returnFormat: 'json'
            });

            const response = await fetch(REDCAP_CONFIG.apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body.toString()
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Failed to create participant record: ${errorText}`);
            }
        }

        async function createCgRecord(apiToken, cgId, formData, arm) {
            const record = [{
                record_id: cgId,
                redcap_event_name: arm,
                [REDCAP_CONFIG.fields.cgFirstName]: formData.cgFirstName,
                [REDCAP_CONFIG.fields.cgLastName]: formData.cgLastName,
                [REDCAP_CONFIG.fields.cgEmail]: formData.cgEmail,
                [REDCAP_CONFIG.fields.ptFirstName]: formData.ptFirstName,
                [REDCAP_CONFIG.fields.ptLastName]: formData.ptLastName,
                [REDCAP_CONFIG.fields.ptDob]: formData.dob,
                [REDCAP_CONFIG.fields.ptAge]: formData.age,
                [REDCAP_CONFIG.fields.recordType]: 1,  // record_type = 1 for caregivers
                [REDCAP_CONFIG.fields.notificationPreference]: formData.notificationPreference,
                [REDCAP_CONFIG.fields.recordStatus]: 1  // 1 = New patient
            }];
            
            // Only include phone numbers if they have values
            if (formData.cgPhone) {
                record[0][REDCAP_CONFIG.fields.cgPhone] = formData.cgPhone;
            }
            if (formData.ptEmail) {
                record[0][REDCAP_CONFIG.fields.ptEmail] = formData.ptEmail;
            }
            if (formData.ptPhone) {
                record[0][REDCAP_CONFIG.fields.ptPhone] = formData.ptPhone;
            }

            const body = new URLSearchParams({
                token: apiToken,
                content: 'record',
                format: 'json',
                type: 'flat',
                overwriteBehavior: 'normal',
                data: JSON.stringify(record),
                returnFormat: 'json'
            });

            const response = await fetch(REDCAP_CONFIG.apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body.toString()
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Failed to create caregiver record: ${errorText}`);
            }
        }

        function showProgress() {
            const dob = document.getElementById('ptDob').value;
            const age = calculateAge(dob);
            const isAdult = age >= 18;
            const caregiverConsent = !isAdult ? document.querySelector('input[name="caregiverConsent"]:checked')?.value : null;
            const createCG = !isAdult && caregiverConsent === 'yes';
            
            currentStep = 0;
            progressBox.style.display = 'block';
            updateProgressDisplay(isAdult, createCG);
        }

        function hideProgress() {
            progressBox.style.display = 'none';
        }

        function updateProgress(step) {
            currentStep = step;
            const dob = document.getElementById('ptDob').value;
            const age = calculateAge(dob);
            const isAdult = age >= 18;
            const caregiverConsent = !isAdult ? document.querySelector('input[name="caregiverConsent"]:checked')?.value : null;
            const createCG = !isAdult && caregiverConsent === 'yes';
            
            updateProgressDisplay(isAdult, createCG);
        }

        function updateProgressDisplay(isAdult, createCG) {
            let steps;
            if (isAdult) {
                steps = stepsAdult;
            } else if (createCG) {
                steps = stepsMinorWithCG;
            } else {
                steps = stepsMinorNoCG;
            }
            
            let html = '<strong>Progress:</strong><br>';
            steps.forEach((step, index) => {
                let className = '';
                if (index < currentStep) {
                    className = 'complete';
                } else if (index === currentStep) {
                    className = 'current';
                }
                html += `<div class="progress-step ${className}">${step}</div>`;
            });
            progressBox.innerHTML = html;
        }

        function showStatus(type, message) {
            statusMessage.className = 'status-message status-' + type;
            statusMessage.textContent = message;
            statusMessage.style.display = 'block';
        }

        function displayLinks(result) {
            if (result.isAdult) {
                linksDisplay.innerHTML = `
                    <h3>📋 Enrollment Complete!</h3>
                    <p style="margin-bottom: 15px;">
                        <strong>Record Number:</strong> ${result.recordNumber}<br>
                        <strong>Participant Record ID:</strong> ${result.ptId}
                    </p>
                `;
            } else if (result.cgCreated) {
                linksDisplay.innerHTML = `
                    <h3>📋 Enrollment Complete!</h3>
                    <p style="margin-bottom: 15px;">
                        <strong>Family ID:</strong> ${result.recordNumber}<br>
                        <strong>Participant Record:</strong> ${result.ptId}<br>
                        <strong>Caregiver Record:</strong> ${result.cgId}
                    </p>
                `;
            } else {
                const hasCargiverInfo = result.caregiverInfoProvided;
                let message;
                if (hasCargiverInfo) {
                    message = 'Note: Caregiver information included in participant record (caregiver did not consent to participate)';
                } else {
                    message = 'Note: No caregiver information collected';
                }
                
                linksDisplay.innerHTML = `
                    <h3>📋 Enrollment Complete!</h3>
                    <p style="margin-bottom: 15px;">
                        <strong>Record Number:</strong> ${result.recordNumber}<br>
                        <strong>Participant Record ID:</strong> ${result.ptId}<br>
                        <em>${message}</em>
                    </p>
                `;
            }
            linksDisplay.style.display = 'block';
        }
    </script>
</body>
</html>
